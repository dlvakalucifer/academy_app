server:
  port: 8081
spring:
  profiles:
    active: local
  application:
    name: academy_app
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/academy
    username: academy
    password: academy
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
academy:
  storage:
    endpoint: http://localhost:9000
    access-key: academy
    secret-key: academy-storage-secret
    bucket: academy-documents