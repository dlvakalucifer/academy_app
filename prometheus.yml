global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - academy_metrics:9090
  - job_name: academy_app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
  - job_name: academy_postgres
    static_configs:
      - targets:
          - academy_postgres_metrics:9187
  - job_name: academy_cache
    static_configs:
      - targets:
          - academy_cache_metrics:9121