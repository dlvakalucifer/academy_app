name: academy_app
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
services:
  academy_db:
    image: postgres:17
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U academy -d academy"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    hostname: academy-db
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - academy_db_data:/var/lib/postgresql/data
  academy_cache:
    image: redis:7
    hostname: academy-cache
    ports:
      - "6379:6379"
  academy_mail:
    image: axllent/mailpit
    hostname: academy-mail
    ports:
      - "1025:1025"
      - "8025:8025"
  academy_admin:
    image: dpage/pgadmin4
    hostname: academy-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@academy.dev
      PGADMIN_DEFAULT_PASSWORD: academy
    ports:
      - "8080:80"
    depends_on:
      - academy_db
    volumes:
      - academy_admin_data:/var/lib/pgadmin
  academy_storage:
    image: minio/minio
    hostname: academy-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: academy
      MINIO_ROOT_PASSWORD: academy-storage-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - academy_storage_data:/data
  academy_metrics:
    image: prom/prometheus
    hostname: academy-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  academy_postgres_metrics:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://academy:academy@academy_db:5432/academy?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - academy_db
  academy_cache_metrics:
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://academy_cache:6379
  academy_dashboards:
    image: grafana/grafana
    hostname: academy-dashboards
    ports:
      - "3000:3000"
    volumes:
      - academy_grafana_data:/var/lib/grafana
  academy_app:
    image: academy-app:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      academy_db:
        condition: service_healthy
    restart: unless-stopped
#    build: .
volumes:
  academy_db_data:
    name: academy_db_data
    external: true
  academy_admin_data:
    name: academy_admin_data
    external: true
  academy_storage_data:
    name: academy_storage_data
    external: true
  academy_grafana_data:
    name: academy_grafana_data
    external: true
