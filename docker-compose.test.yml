name: academy_app_test
services:
  academy_db:
    image: postgres:17
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U academy -d academy"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    hostname: academy-db
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
